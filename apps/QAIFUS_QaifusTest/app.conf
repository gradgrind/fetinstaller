PROJECT=%PROJECT%
VERSION=%VERSION%

; Key of EXEC to be offered for launching from the installer:
LAUNCH=QaifusTest1

; The "PROJECTLONGNAME" entries are such that they can be copied directly
; from a Linux .desktop file, allowing translations to be specified:
GenericName=Test applications for the QAIFUS installer program
GenericName[de]=Testanwendungen für das QAIFUS-Installationsprogramm

; The "EXEC\..." keys refer to the executable files, without possible extensions
; (like ".exe" on Windows), which are expected in the appropriate places ("bin"
; on Linux, in the root folder on Windows).
; The values have three fields, separated by ":":
;   1) the file extension,
;   2) the name of start-menu and desktop links,
;   3) the "Exec=" value for the Linux .desktop file, using %APP% as placeholder
;      for the executable.
: A command-line-only executable would have fields 2 and 3 empty.
; On Windows the third field declares file-type associations.
; On Linux, if there is an entry in the second field there must be a "desktop"
; file, <key>.desktop, installed in "share/applications. The actual values in
: the second and third fields are only needed for the modified desktop file
: produced for "versioned" installations.

[Linux]
EXEC\QaifusTest1=:QaifusTest1:%APP% %f
EXEC\QaifusTest2=:QaifusTest2:%APP% %f
EXEC\QaifusTest3=::

; On Linux file-type associations are dealt with by the mime info database.
; The files for this are "share/mime/packages/<key>.xml", where <key> is from
; the EXEC line. Such a file may or may not exist.

[Windows]
EXEC\QaifusTest1=.exe:QaifusTest1:.qaifustest1>QaifusTest1_ID
EXEC\QaifusTest2=.exe:QaifusTest2:.qaifustest2>QaifusTest2_ID
EXEC\QaifusTest3=.exe::

; On Windows file-type associations must be explicitly declared here.
; They are in the third EXEC field. There may be multiple entries, separated
; by a comma.

; These are for the Uninstall entry in the registry:
Publisher="gradgrind"
WebLink="https://github.com/gradgrind/QAIFUS"

